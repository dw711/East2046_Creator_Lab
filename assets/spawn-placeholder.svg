<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder for the MANI spawn-view screenshot (J5). Grey street, path to a golden garden. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E9592"/>
      <stop offset=".55" stop-color="#C9B98F"/>
      <stop offset="1" stop-color="#E9C77E"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E7A5A"/>
      <stop offset="1" stop-color="#4C524D"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B77A"/>
      <stop offset="1" stop-color="#8A8C88"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE8A8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFE8A8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect y="470" width="1600" height="430" fill="url(#ground)"/>
  <!-- grey walls either side -->
  <polygon points="0,0 520,330 520,560 0,900" fill="#5C625F"/>
  <polygon points="1600,0 1080,330 1080,560 1600,900" fill="#535956"/>
  <!-- garden in the distance -->
  <ellipse cx="660" cy="470" rx="120" ry="60" fill="#3F6B45"/>
  <ellipse cx="940" cy="465" rx="140" ry="70" fill="#466F43"/>
  <ellipse cx="800" cy="450" rx="90" ry="55" fill="#5B8048"/>
  <circle cx="800" cy="440" r="160" fill="url(#glow)"/>
  <!-- path -->
  <polygon points="760,480 840,480 1150,900 450,900" fill="url(#path)"/>
</svg>
